spring:
  datasource:
    url: jdbc:h2:file:./data/fantasy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2
  data:
    mongodb:
      uri: mongodb://localhost:27018/fantasy

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.4

security:
  jwt:
    secret: fantasy-world-secret-key-super-longue-pour-etre-securisee-2024
    expiration: 86400000